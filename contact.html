<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11152d" />
    <title>Contact Us | Hello, World!</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap");
      * { box-sizing:border-box; } body { align-items:center; background:#11152d; color:#f7f7ff; display:flex; font-family:"Space Grotesk",Arial,sans-serif; justify-content:center; margin:0; min-height:100vh; padding:24px; } .orb { border-radius:50%; filter:blur(2px); opacity:.82; position:fixed; } .orb-one { background:#9d7bff; height:34vw; left:-10vw; top:-12vw; width:34vw; } .orb-two { background:#00d6b3; bottom:-18vw; height:40vw; right:-12vw; width:40vw; }
      main { backdrop-filter:blur(18px); background:rgba(23,29,61,.68); border:1px solid rgba(255,255,255,.22); border-radius:28px; box-shadow:0 28px 70px rgba(4,7,26,.45); max-width:720px; padding:clamp(32px,7vw,62px); position:relative; text-align:center; width:100%; } nav { display:flex; gap:20px; justify-content:center; margin:0 0 45px; } nav a { color:#d1d5ef; font-size:.9rem; font-weight:600; text-decoration:none; } nav a:hover, nav a[aria-current="page"] { color:#9fffe9; }
      .eyebrow { color:#9fffe9; font-family:"DM Mono",monospace; font-size:.78rem; letter-spacing:.12em; margin:0 0 18px; text-transform:uppercase; } h1 { font-size:clamp(3rem,9vw,5.5rem); letter-spacing:-.07em; line-height:.95; margin:0; } h1 span { background:linear-gradient(115deg,#fff 20%,#b8a6ff 55%,#76f5d7 88%); -webkit-background-clip:text; background-clip:text; color:transparent; } .copy { color:#d1d5ef; line-height:1.65; margin:24px auto 28px; max-width:440px; }
      form { display:grid; gap:13px; margin:auto; max-width:460px; text-align:left; } label { color:#d1d5ef; font-size:.85rem; font-weight:600; } input, textarea { background:rgba(7,11,35,.44); border:1px solid rgba(255,255,255,.18); border-radius:12px; color:#fff; font:inherit; padding:13px; width:100%; } textarea { min-height:105px; resize:vertical; } button { background:#f6f4ff; border:0; border-radius:999px; color:#191c37; cursor:pointer; font:700 1rem "Space Grotesk",sans-serif; justify-self:center; margin-top:8px; padding:14px 24px; } button:hover { transform:translateY(-2px); }
    </style>
  </head>
  <body>
    <div class="orb orb-one"></div><div class="orb orb-two"></div>
    <main>
      <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="gallery.html">Gallery</a><a aria-current="page" href="contact.html">Contact</a></nav>
      <p class="eyebrow">Let’s connect</p>
      <h1>Drop a <span>line.</span></h1>
      <p class="copy">Have an idea, a question, or just want to say hello? Send a message below.</p>
      <form action="#" method="post">
        <label for="name">Name</label><input id="name" name="name" autocomplete="name" placeholder="Your name" required />
        <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
        <label for="message">Message</label><textarea id="message" name="message" placeholder="What’s on your mind?" required></textarea>
        <button type="submit">Send message →</button>
      </form>
    </main>
  </body>
</html>
